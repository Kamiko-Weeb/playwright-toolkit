name: scanner tests

on:
  push:
    paths:
      - "modules/scanner.py"
      - "modules/pe.py"
      - "modules/evaluate.py"
      - "tests/**"
      - "config/signatures.json"
      - "rules/**"
      - ".github/workflows/scanner-tests.yml"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install scanner dependencies
        # The scanner core is stdlib-only; these cover settings loading and the
        # optional layers (requests for VirusTotal, yara-python for YARA rules).
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv requests yara-python

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run detection evaluation
        run: python main.py eval
